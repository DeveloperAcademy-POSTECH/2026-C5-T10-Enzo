  <script id="explorer-logic" type="text/javascript">
  (() => {
    "use strict";

    const VIEW_LABELS = {
      context: "System Context",
      containers: "Container Diagram",
      "iphone-components": "iPhone Components",
      "watch-components": "Watch Components"
    };

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getParentViewId(viewId) {
      return ({
        containers: "context",
        "iphone-components": "containers",
        "watch-components": "containers"
      })[viewId] ?? null;
    }

    function getBreadcrumbs(viewId) {
      const chain = [];
      let cursor = viewId;
      while (cursor) {
        chain.unshift(cursor);
        cursor = getParentViewId(cursor);
      }
      return chain;
    }

    function getNodeById(model, viewId, nodeId) {
      return model.views[viewId]?.nodes.find((node) => node.id === nodeId) ?? null;
    }

    function createWorkspaceState() {
      return {
        currentView: "context",
        selectedNode: null,
        leftPanelOpen: true,
        rightPanelOpen: false,
        leftTab: "views",
        inspectorTab: "overview",
        tool: "select",
        viewports: {}
      };
    }

    function reduceWorkspace(model, state, action) {
      const next = { ...state };
      if (action.type === "toggle-left-panel") next.leftPanelOpen = !state.leftPanelOpen;
      if (action.type === "toggle-right-panel") next.rightPanelOpen = !state.rightPanelOpen;
      if (action.type === "select-node" && getNodeById(model, state.currentView, action.nodeId)) {
        next.selectedNode = action.nodeId;
        next.rightPanelOpen = true;
      }
      if (action.type === "clear-selection") {
        next.selectedNode = null;
        next.rightPanelOpen = false;
      }
      if (action.type === "set-left-tab" && ["views", "layers"].includes(action.tab)) next.leftTab = action.tab;
      if (action.type === "set-inspector-tab" && ["overview", "flow", "evidence", "model"].includes(action.tab)) next.inspectorTab = action.tab;
      if (action.type === "set-tool" && ["select", "hand"].includes(action.tool)) next.tool = action.tool;
      return next;
    }

    function normalizePanelsForWidth(state, width, openedPanel) {
      if (width > 1199 || !(state.leftPanelOpen && state.rightPanelOpen)) return state;
      return openedPanel === "left"
        ? { ...state, leftPanelOpen: true, rightPanelOpen: false }
        : { ...state, leftPanelOpen: false, rightPanelOpen: true };
    }

    function validateModel(model) {
      const ALLOWED_VISUAL_ROLES = new Set(["person", "softwareSystem", "application", "mobileApplication", "dataStore", "component"]);
      const errors = [];
      for (const [viewId, view] of Object.entries(model.views ?? {})) {
        if (!(view.worldSize?.width > 0 && view.worldSize?.height > 0)) errors.push(`${viewId}:invalid-world-size`);
        const ids = new Set((view.nodes ?? []).map((node) => node.id));
        for (const node of view.nodes ?? []) {
          if (!ALLOWED_VISUAL_ROLES.has(node.visualRole)) errors.push(`${viewId}:${node.id}:invalid-visual-role`);
          if (!node.description) errors.push(`${viewId}:${node.id}:missing-description`);
          if (["Container", "Component"].includes(node.type) && !node.technology) errors.push(`${viewId}:${node.id}:missing-technology`);
        }
        for (const relationship of view.relationships ?? []) {
          if (!ids.has(relationship.from)) errors.push(`${viewId}:${relationship.id}:missing-source`);
          if (!ids.has(relationship.to)) errors.push(`${viewId}:${relationship.id}:missing-target`);
          if (!relationship.description) errors.push(`${viewId}:${relationship.id}:missing-description`);
          if (view.level >= 2 && !relationship.technology) errors.push(`${viewId}:${relationship.id}:missing-technology`);
        }
        for (const boundary of view.boundaries ?? []) for (const member of boundary.members ?? []) if (!ids.has(member)) errors.push(`${viewId}:${boundary.id}:missing-member:${member}`);
        if (view.level === 3 && view.nodes.some((node) => node.drilldown)) errors.push(`${viewId}:level-4-drilldown`);
      }
      return { valid: errors.length === 0, errors };
    }

    function defaultSelection(model, viewId) {
      const view = model.views[viewId];
      if (!view || view.level !== 3) return null;
      return view.nodes.find((node) => node.type === "Component" && node.status === "active")?.id ?? null;
    }

    function createNavigationState() {
      return { currentView: "context", selectedNode: null };
    }

    function reduceNavigation(model, state, action) {
      const next = { ...state };
      if (action.type === "view") {
        if (!model.views[action.viewId]) return next;
        next.currentView = action.viewId;
        next.selectedNode = defaultSelection(model, action.viewId);
        return next;
      }
      if (action.type === "up") {
        const parent = getParentViewId(state.currentView);
        if (!parent) return next;
        next.currentView = parent;
        next.selectedNode = defaultSelection(model, parent);
        return next;
      }
      if (action.type === "activate-node" || action.type === "select-node") {
        const node = getNodeById(model, state.currentView, action.nodeId);
        if (!node) return next;
        if (action.type === "activate-node" && node.drilldown && model.views[node.drilldown]) {
          next.currentView = node.drilldown;
          next.selectedNode = defaultSelection(model, node.drilldown);
        } else {
          next.selectedNode = node.id;
        }
      }
      return next;
    }

    function getPersonGeometry(node) {
      const w = node.w;
      const h = node.h;
      const headRadius = Math.max(8, Math.min(26, w * 0.16, h * 0.24));
      const headTop = Math.max(4, h * 0.08);
      const headCy = Math.min(h - headRadius - 4, headTop + headRadius);
      const bodyTop = Math.min(h - 2, Math.max(headCy + headRadius + 8, h * 0.44));
      const joinY = Math.min(h - 2, Math.max(bodyTop + 10, h * 0.58));
      return {
        head: { cx: w / 2, cy: headCy, r: headRadius },
        body: {
          sideInset: Math.min(26, w * 0.15),
          shoulderInset: Math.min(72, w * 0.4),
          top: bodyTop,
          joinY,
          bottom: h - 2
        }
      };
    }

    function buildShapeGeometry(node) {
      const w = node.w;
      const h = node.h;
      const common = `<rect class="node-surface" x="1" y="1" width="${w - 2}" height="${h - 2}" rx="20"/>`;
      if (node.visualRole === "person") {
        const person = getPersonGeometry(node);
        return `<circle class="semantic-person-head" cx="${person.head.cx}" cy="${person.head.cy}" r="${person.head.r}"/>
          <path class="node-surface semantic-person-body" d="M ${person.body.sideInset} ${person.body.joinY} Q ${person.body.sideInset} ${person.body.top} ${person.body.shoulderInset} ${person.body.top} H ${w - person.body.shoulderInset} Q ${w - person.body.sideInset} ${person.body.top} ${w - person.body.sideInset} ${person.body.joinY} V ${person.body.bottom} H ${person.body.sideInset} Z"/>`;
      }
      if (node.visualRole === "softwareSystem") {
        return `<path class="node-surface" d="M 1 1 H ${w - 30} L ${w - 1} 30 V ${h - 1} H 1 Z"/>
          <path class="semantic-file-fold" d="M ${w - 30} 1 V 30 H ${w - 1}"/>`;
      }
      if (node.visualRole === "dataStore") {
        return `<path class="node-surface" d="M 1 24 C 1 2 ${w - 1} 2 ${w - 1} 24 V ${h - 24} C ${w - 1} ${h - 2} 1 ${h - 2} 1 ${h - 24} Z"/>
          <ellipse class="semantic-store-top" cx="${w / 2}" cy="24" rx="${w / 2 - 1}" ry="22"/>
          <path class="semantic-store-bottom" d="M 1 ${h - 24} C 1 ${h - 2} ${w - 1} ${h - 2} ${w - 1} ${h - 24}"/>`;
      }
      if (node.visualRole === "application") {
        return `${common}<path class="semantic-app-chrome" d="M 1 38 H ${w - 1}"/>
          <circle cx="20" cy="20" r="4"/><circle cx="34" cy="20" r="4"/><circle cx="48" cy="20" r="4"/>`;
      }
      if (node.visualRole === "mobileApplication") {
        return `${common}<path class="semantic-app-chrome" d="M 1 38 H ${w - 1}"/>
          <rect class="semantic-device-cue" x="${w - 46}" y="10" width="26" height="18" rx="6"/>`;
      }
      return `${common}<path class="semantic-component-cue" d="M 18 1 V 14 H 34 V 1"/>`;
    }

    function estimateSvgTextWidth(value, fontSize = 12) {
      const units = Array.from(String(value)).reduce((total, character) => {
        if (/\s/.test(character)) return total + .34;
        if (/[A-Za-z0-9]/.test(character)) return total + .58;
        if (/[.,:;()\[\]{}&+\-\/·→]/.test(character)) return total + .42;
        return total + 1;
      }, 0);
      return units * fontSize;
    }

    function wrapSvgText(value, maxWidth = 200, fontSize = 12) {
      const tokens = String(value).trim().split(/(\s+)/).filter(Boolean);
      const lines = [];
      let line = "";
      const pushLine = () => { if (line.trim()) lines.push(line.trim()); line = ""; };
      for (const token of tokens) {
        if (estimateSvgTextWidth(`${line}${token}`, fontSize) <= maxWidth || !line.trim()) {
          line += token;
          continue;
        }
        pushLine();
        if (estimateSvgTextWidth(token, fontSize) <= maxWidth) {
          line = token.trimStart();
          continue;
        }
        for (const character of Array.from(token.trim())) {
          if (estimateSvgTextWidth(`${line}${character}`, fontSize) > maxWidth && line) pushLine();
          line += character;
        }
      }
      pushLine();
      return lines.filter(Boolean);
    }

    function getNodeTextBounds(node) {
      const base = { x: 18, top: 30, width: Math.max(72, node.w - 36), bottom: node.h - 14 };
      if (node.visualRole === "person") {
        const person = getPersonGeometry(node);
        const x = 20;
        return { x, top: person.body.top + 4, width: Math.max(60, node.w - x * 2), bottom: node.h - 12 };
      }
      if (node.visualRole === "softwareSystem") return { ...base, top: 48, width: Math.max(80, node.w - 52) };
      if (node.visualRole === "dataStore") return { ...base, x: 22, top: 50, width: Math.max(76, node.w - 44), bottom: node.h - 18 };
      if (["application", "mobileApplication"].includes(node.visualRole)) return { ...base, top: 50, width: Math.min(190, base.width), bottom: node.h - (node.drilldown || node.status === "gap" ? 32 : 14) };
      return { ...base, top: 30, bottom: node.h - (node.status === "gap" ? 32 : 14) };
    }

    function svgTextLines(lines, x, startY, className, lineHeight = 21) {
      return `<text class="${className}" x="${x}" y="${startY}">${lines.map((line, index) =>
        `<tspan x="${x}" dy="${index ? lineHeight : 0}">${escapeHTML(line)}</tspan>`
      ).join("")}</text>`;
    }

    function createSvgTextLayout(node, bounds, typography) {
      const nameLines = wrapSvgText(node.name, bounds.width, typography.name);
      const meta = node.technology ? `[${node.type}: ${node.technology}]` : `[${node.type}]`;
      const metaLines = wrapSvgText(meta, bounds.width, typography.meta);
      const descriptionLines = wrapSvgText(node.description, bounds.width, typography.description);
      const nameBaseline = bounds.top + typography.name;
      const metaBaseline = nameBaseline + (nameLines.length - 1) * typography.nameLineHeight + typography.gap + typography.meta;
      const descriptionBaseline = metaBaseline + (metaLines.length - 1) * typography.metaLineHeight + typography.gap + typography.description;
      const lastBaseline = (baseline, lines, lineHeight) => baseline + Math.max(lines.length - 1, 0) * lineHeight;
      return {
        bounds,
        name: { lines: nameLines, baseline: nameBaseline, lastBaseline: lastBaseline(nameBaseline, nameLines, typography.nameLineHeight), lineHeight: typography.nameLineHeight, fontSize: typography.name },
        meta: { lines: metaLines, baseline: metaBaseline, lastBaseline: lastBaseline(metaBaseline, metaLines, typography.metaLineHeight), lineHeight: typography.metaLineHeight, fontSize: typography.meta },
        description: { lines: descriptionLines, baseline: descriptionBaseline, lastBaseline: lastBaseline(descriptionBaseline, descriptionLines, typography.descriptionLineHeight), lineHeight: typography.descriptionLineHeight, fontSize: typography.description },
        affordanceBaseline: node.h - 22
      };
    }

    function getSvgTextLayout(node) {
      const bounds = getNodeTextBounds(node);
      const compact = node.h <= 170 || node.visualRole === "component";
      const base = compact
        ? { name: 14, nameLineHeight: 16, meta: 9, metaLineHeight: 11, description: 10, descriptionLineHeight: 12, gap: 7 }
        : { name: 16, nameLineHeight: 20, meta: 10, metaLineHeight: 12, description: 12, descriptionLineHeight: 14, gap: 9 };
      for (const scale of [1, .9, .8, .72, .65]) {
        const typography = {
          name: Math.max(10, Math.round(base.name * scale * 10) / 10),
          nameLineHeight: Math.max(11, Math.round(base.nameLineHeight * scale * 10) / 10),
          meta: Math.max(8, Math.round(base.meta * scale * 10) / 10),
          metaLineHeight: Math.max(9, Math.round(base.metaLineHeight * scale * 10) / 10),
          description: Math.max(8, Math.round(base.description * scale * 10) / 10),
          descriptionLineHeight: Math.max(9, Math.round(base.descriptionLineHeight * scale * 10) / 10),
          gap: Math.max(4, Math.round(base.gap * scale * 10) / 10)
        };
        const layout = createSvgTextLayout(node, bounds, typography);
        if (layout.description.lastBaseline <= bounds.bottom) return layout;
      }
      return createSvgTextLayout(node, bounds, {
        name: 10, nameLineHeight: 11, meta: 8, metaLineHeight: 9, description: 8, descriptionLineHeight: 9, gap: 4
      });
    }

    function getBoundaryLabelBounds(boundary) {
      const left = boundary.x + 24;
      const titleWidth = estimateSvgTextWidth(boundary.name, 16);
      const typeWidth = estimateSvgTextWidth(`[${boundary.type}]`, 12);
      return { left, right: left + Math.max(titleWidth, typeWidth), top: boundary.y + 14, bottom: boundary.y + 60 };
    }

    function buildBoundaryMarkup(boundary) {
      return `<g class="c4-boundary" data-boundary-id="${escapeHTML(boundary.id)}">
        <rect x="${boundary.x}" y="${boundary.y}" width="${boundary.w}" height="${boundary.h}" rx="28"/>
        <text x="${boundary.x + 24}" y="${boundary.y + 34}">${escapeHTML(boundary.name)}</text>
        <text class="boundary-type" x="${boundary.x + 24}" y="${boundary.y + 56}">[${escapeHTML(boundary.type)}]</text>
      </g>`;
    }

    function buildSvgNodeMarkup(node, selected) {
      const layout = getSvgTextLayout(node);
      const drilldown = node.drilldown
        ? `<g class="node-open" data-open-node-id="${escapeHTML(node.id)}"><text x="${layout.bounds.x}" y="${node.h - 22}">Open L${node.type === "Software System" ? 2 : 3} →</text></g>`
        : "";
      const status = node.status === "gap"
        ? `<text class="node-status" x="24" y="${node.h - 22}">구현됨 · 미배선</text>`
        : "";
      return `<g class="diagram-node status-${escapeHTML(node.status)} role-${escapeHTML(node.visualRole)}"
          transform="translate(${node.x} ${node.y})" data-node-id="${escapeHTML(node.id)}"
          role="button" tabindex="0" aria-pressed="${selected ? "true" : "false"}"
          style="--node-name-size:${layout.name.fontSize}px;--node-meta-size:${layout.meta.fontSize}px;--node-description-size:${layout.description.fontSize}px">
        <title>${escapeHTML(`${node.name}, ${node.type}, ${node.description}`)}</title>
        ${buildShapeGeometry(node)}
        ${svgTextLines(layout.name.lines, layout.bounds.x, layout.name.baseline, "node-name", layout.name.lineHeight)}
        ${svgTextLines(layout.meta.lines, layout.bounds.x, layout.meta.baseline, "node-meta", layout.meta.lineHeight)}
        ${svgTextLines(layout.description.lines, layout.bounds.x, layout.description.baseline, "node-description", layout.description.lineHeight)}
        ${drilldown}${status}
      </g>`;
    }

    function renderSvgWorld(view, state) {
      return [
        `<g class="boundary-layer">${view.boundaries.map(buildBoundaryMarkup).join("")}</g>`,
        '<g class="relationship-layer"></g>',
        `<g class="node-layer">${view.nodes.map((node) => buildSvgNodeMarkup(node, node.id === state.selectedNode)).join("")}</g>`
      ].join("");
    }

    function listMarkup(items) {
      return `<ul>${items.map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ul>`;
    }

    function buildEvidenceMarkup(node) {
      const statusNote = node.status === "gap"
        ? '<p class="status-note"><strong>구현됨 · 미배선</strong><br>타입과 저장 로직은 존재하지만 현재 앱 진입점과 연습 흐름에서 생성·주입되지 않습니다.</p>'
        : "";
      return `<div class="evidence-head"><p class="evidence-kicker">Selected element</p><h3 class="evidence-title">${escapeHTML(node.name)}</h3><p class="evidence-meta">[${escapeHTML(node.type)} · ${escapeHTML(node.technology)}]</p></div><div class="evidence-body"><p class="evidence-description">${escapeHTML(node.description)}</p>${statusNote}<section class="evidence-section"><h4>입력</h4>${listMarkup(node.inputs)}</section><section class="evidence-section"><h4>출력</h4>${listMarkup(node.outputs)}</section><section class="evidence-section"><h4>코드 근거</h4><div class="evidence-files">${node.evidence.map((path) => `<code>${escapeHTML(path)}</code>`).join("")}</div></section></div>`;
    }

    const INSPECTOR_TABS = ["overview", "flow", "evidence", "model"];

    function buildViewsMarkup(model, state) {
      const order = ["context", "containers", "iphone-components", "watch-components"];
      return `<nav class="view-list" aria-label="C4 Views">${order.map((viewId) => {
        const view = model.views[viewId];
        return `<button type="button" data-view-id="${viewId}"${state.currentView === viewId ? ' aria-current="page"' : ""}>
          <strong>L${view.level} · ${escapeHTML(VIEW_LABELS[viewId])}</strong><small>${escapeHTML(view.scopeName)}</small>
        </button>`;
      }).join("")}</nav>`;
    }

    function buildLayersMarkup(view, state) {
      const boundaries = view.boundaries.map((boundary) => `<li><span>${escapeHTML(boundary.name)}</span><small>[${escapeHTML(boundary.type)}]</small></li>`).join("");
      const nodes = view.nodes.map((node) => `<li><button type="button" data-node-id="${escapeHTML(node.id)}"${state.selectedNode === node.id ? ' aria-current="true"' : ""}>${escapeHTML(node.name)}<small>[${escapeHTML(node.type)}]</small></button></li>`).join("");
      const relationships = view.relationships.map((relationship) => `<li>${escapeHTML(relationship.description)}${relationship.technology ? `<small>[${escapeHTML(relationship.technology)}]</small>` : ""}</li>`).join("");
      return `<div class="layer-groups">
        <section><h3>Boundaries</h3><ul>${boundaries}</ul></section>
        <section><h3>Elements</h3><ul>${nodes}</ul></section>
        <section><h3>Relationships</h3><ul>${relationships}</ul></section>
      </div>`;
    }

    function buildLeftPanelMarkup(model, state) {
      const tabs = [
        ["views", "뷰"],
        ["layers", "레이어"]
      ].map(([tab, label]) => `<button class="panel-tab" type="button" id="left-tab-${tab}" role="tab" data-left-tab="${tab}" aria-controls="left-tabpanel-${tab}" aria-selected="${state.leftTab === tab}" tabindex="${state.leftTab === tab ? "0" : "-1"}">${label}</button>`).join("");
      const view = model.views[state.currentView];
      return `<div class="panel-tabs" role="tablist" aria-label="탐색 패널">${tabs}</div>
        <div id="left-tabpanel-views" role="tabpanel" aria-labelledby="left-tab-views"${state.leftTab === "views" ? "" : " hidden"}>${buildViewsMarkup(model, state)}</div>
        <div id="left-tabpanel-layers" role="tabpanel" aria-labelledby="left-tab-layers"${state.leftTab === "layers" ? "" : " hidden"}>${buildLayersMarkup(view, state)}</div>`;
    }

    function formatRelationshipFlow(model, view, relationship) {
      const source = getNodeById(model, view.id, relationship.from);
      const target = getNodeById(model, view.id, relationship.to);
      return `<p class="flow-item"><strong>${escapeHTML(source?.name ?? relationship.from)} → ${escapeHTML(target?.name ?? relationship.to)}</strong><span>${escapeHTML(relationship.description)}</span>${relationship.technology ? `<small>[${escapeHTML(relationship.technology)}]</small>` : ""}</p>`;
    }

    function buildInspectorMarkup(model, state) {
      const view = model.views[state.currentView];
      const node = state.selectedNode ? getNodeById(model, state.currentView, state.selectedNode) : null;
      const tabs = INSPECTOR_TABS.map((tab) => `<button type="button" id="inspector-tab-${tab}" role="tab" data-inspector-tab="${tab}" aria-controls="inspector-tabpanel-${tab}" aria-selected="${state.inspectorTab === tab}" tabindex="${state.inspectorTab === tab ? "0" : "-1"}">${escapeHTML(tab)}</button>`).join("");
      const validation = validateModel(model);
      const modelContent = `<h2>${escapeHTML(view.title)}</h2><p>${escapeHTML(view.scopeName)}</p><code>${escapeHTML(model.meta.analyzedCommit)}</code><code>${escapeHTML(model.meta.sourceRoot)}</code><section><h3>모델 검증</h3>${validation.errors.length ? listMarkup(validation.errors) : "<p>검증 경고 없음</p>"}</section>`;
      const emptyContent = {
        overview: "<p class=\"evidence-empty\">요소를 선택해 책임과 구현 상태를 확인하세요.</p>",
        flow: "<p class=\"evidence-empty\">요소를 선택해 들어오고 나가는 관계를 확인하세요.</p>",
        evidence: "<p class=\"evidence-empty\">요소를 선택해 입력, 출력, 코드 근거를 확인하세요.</p>",
        model: modelContent
      };
      const contents = node ? (() => {
        const incoming = view.relationships.filter((relationship) => relationship.to === node.id);
        const outgoing = view.relationships.filter((relationship) => relationship.from === node.id);
        const meta = node.technology ? `${node.type}: ${node.technology}` : node.type;
        const status = node.status === "gap" ? "구현됨 · 미배선" : "구현·연결됨";
        return {
          overview: `<h2>${escapeHTML(node.name)}</h2><p>[${escapeHTML(meta)}]</p><p>${escapeHTML(node.description)}</p><p>${status}</p><div class="overview-evidence">${node.evidence.map((path) => `<code>${escapeHTML(path)}</code>`).join("")}</div>${node.drilldown && model.views[node.drilldown] ? `<button type="button" data-open-node-id="${escapeHTML(node.id)}">Open L${model.views[node.drilldown].level}</button>` : ""}`,
          flow: `<h2>Flow</h2>${[...incoming, ...outgoing].map((relationship) => formatRelationshipFlow(model, view, relationship)).join("") || "<p>연결된 관계가 없습니다.</p>"}`,
          evidence: `<h2>Evidence</h2><section><h3>입력</h3>${listMarkup(node.inputs)}</section><section><h3>출력</h3>${listMarkup(node.outputs)}</section><section><h3>코드 근거</h3><div class="evidence-files">${node.evidence.map((path) => `<code>${escapeHTML(path)}</code>`).join("")}</div></section>`,
          model: modelContent
        };
      })() : emptyContent;
      const panels = INSPECTOR_TABS.map((tab) => `<div id="inspector-tabpanel-${tab}" class="inspector-tabpanel" role="tabpanel" aria-labelledby="inspector-tab-${tab}"${state.inspectorTab === tab ? "" : " hidden"}>${contents[tab]}</div>`).join("");
      return `<div class="inspector-tabs" role="tablist">${tabs}</div>${panels}`;
    }

    function switchView(state, viewId) {
      if (!architectureModel?.views?.[viewId]) return state;
      return { ...state, currentView: viewId, selectedNode: null, rightPanelOpen: false, inspectorTab: "overview" };
    }

    function openDrilldown(model, state, nodeId) {
      const node = getNodeById(model, state.currentView, nodeId);
      if (!node?.drilldown || !model.views[node.drilldown]) return state;
      return { ...state, currentView: node.drilldown, selectedNode: null, rightPanelOpen: false, inspectorTab: "overview" };
    }

    function getLayoutMode(width) {
      return width <= 760 ? "compact" : "diagram";
    }

    function clampScale(scale) {
      return Math.min(2, Math.max(0.25, scale));
    }

    function panViewport(viewport, dx, dy) {
      return { ...viewport, x: viewport.x + dx, y: viewport.y + dy };
    }

    function zoomViewportAt(viewport, point, nextScale) {
      const scale = clampScale(nextScale);
      const ratio = scale / viewport.scale;
      return {
        x: point.x - (point.x - viewport.x) * ratio,
        y: point.y - (point.y - viewport.y) * ratio,
        scale
      };
    }

    function fitViewport(worldSize, frameSize, padding = 72) {
      const usableWidth = Math.max(1, frameSize.width - padding * 2);
      const usableHeight = Math.max(1, frameSize.height - padding * 2);
      const scale = clampScale(Math.min(usableWidth / worldSize.width, usableHeight / worldSize.height));
      return {
        x: (frameSize.width - worldSize.width * scale) / 2,
        y: (frameSize.height - worldSize.height * scale) / 2,
        scale
      };
    }

    function constrainViewport(viewport, worldSize, frameSize, margin = 160) {
      const scale = clampScale(viewport.scale);
      const minX = Math.min(margin, frameSize.width - worldSize.width * scale - margin);
      const minY = Math.min(margin, frameSize.height - worldSize.height * scale - margin);
      return {
        x: Math.min(margin, Math.max(minX, viewport.x)),
        y: Math.min(margin, Math.max(minY, viewport.y)),
        scale
      };
    }

    let architectureModel = null;
    let workspaceState = createWorkspaceState();
    // Kept as a compatibility snapshot for callers of the original navigation helpers.
    let navigationState = { currentView: workspaceState.currentView, selectedNode: workspaceState.selectedNode };

    function localPoint(event, element) {
      const rect = element.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function currentViewport() {
      return workspaceState.viewports[workspaceState.currentView] ?? { x: 0, y: 0, scale: 1 };
    }

    function currentViewportFrame() {
      const viewport = document.getElementById("diagram-viewport");
      const rect = viewport?.getBoundingClientRect();
      return { width: Math.max(1, rect?.width ?? 1), height: Math.max(1, rect?.height ?? 1) };
    }

    function syncSvgCoordinateSystem() {
      const svg = document.getElementById("diagram-svg");
      if (!svg) return;
      const frame = currentViewportFrame();
      svg.setAttribute("viewBox", `0 0 ${frame.width} ${frame.height}`);
    }

    function scheduleCanvasCoordinateSync() {
      if (typeof document === "undefined" || typeof window === "undefined") return;
      const sync = () => syncSvgCoordinateSystem();
      window.requestAnimationFrame?.(sync);
      window.setTimeout?.(sync, 220);
    }

    function applyViewportTransform(viewportState) {
      document.getElementById("diagram-world")
        ?.setAttribute("transform", `translate(${viewportState.x} ${viewportState.y}) scale(${viewportState.scale})`);
    }

    function renderCanvasTools() {
      if (typeof document === "undefined") return;
      const viewport = document.getElementById("diagram-viewport");
      const zoomValue = document.getElementById("zoom-value");
      if (viewport) viewport.dataset.tool = workspaceState.tool;
      if (zoomValue) zoomValue.textContent = `${Math.round(currentViewport().scale * 100)}%`;
    }

    function setViewport(viewportState) {
      if (!architectureModel || typeof document === "undefined") return;
      const frame = currentViewportFrame();
      const worldSize = architectureModel.views[workspaceState.currentView].worldSize;
      const finite = [viewportState.x, viewportState.y, viewportState.scale].every(Number.isFinite);
      const safeViewport = constrainViewport(
        finite ? viewportState : fitViewport(worldSize, frame, 72),
        worldSize,
        frame,
        160
      );
      workspaceState = {
        ...workspaceState,
        viewports: { ...workspaceState.viewports, [workspaceState.currentView]: safeViewport }
      };
      applyViewportTransform(safeViewport);
      renderCanvasTools();
    }

    function ensureViewportForCurrentView() {
      if (!architectureModel || typeof document === "undefined") return;
      const saved = workspaceState.viewports[workspaceState.currentView];
      if (saved) {
        applyViewportTransform(saved);
        renderCanvasTools();
        return;
      }
      const frame = currentViewportFrame();
      const worldSize = architectureModel.views[workspaceState.currentView].worldSize;
      setViewport(fitViewport(worldSize, frame, 72));
    }

    function zoomBy(factor) {
      const frame = currentViewportFrame();
      const center = { x: frame.width / 2, y: frame.height / 2 };
      const viewportState = currentViewport();
      setViewport(zoomViewportAt(viewportState, center, viewportState.scale * factor));
    }

    function applyWorkspaceState(next, openedPanel) {
      const width = typeof window === "undefined" ? 1200 : window.innerWidth;
      workspaceState = normalizePanelsForWidth(next, width, openedPanel);
      navigationState = { currentView: workspaceState.currentView, selectedNode: workspaceState.selectedNode };
      renderWorkspaceChrome();
      renderCanvasTools();
    }

    function updateWorkspace(action) {
      if (!architectureModel) return;
      const openedPanel = action.type === "select-node"
        ? "right"
        : action.type === "toggle-left-panel" && !workspaceState.leftPanelOpen
          ? "left"
          : action.type === "toggle-right-panel" && !workspaceState.rightPanelOpen
            ? "right"
            : undefined;
      applyWorkspaceState(reduceWorkspace(architectureModel, workspaceState, action), openedPanel);
    }

    function dispatchWorkspace(action) {
      if (!architectureModel) return;
      updateWorkspace(action);
    }

    function viewAction(action) {
      if (!architectureModel || typeof document === "undefined") return;
      if (action.type === "select-node") {
        dispatchWorkspace(action);
        return;
      }
      if (action.type === "activate-node") {
        const node = getNodeById(architectureModel, navigationState.currentView, action.nodeId);
        if (node && !node.drilldown) {
          dispatchWorkspace({ type: "select-node", nodeId: action.nodeId });
          return;
        }
      }
      const next = reduceNavigation(architectureModel, navigationState, action);
      applyWorkspaceState({ ...workspaceState, ...next });
      renderDiagram(workspaceState.currentView);
    }

    function navigateTo(viewId) {
      if (!architectureModel?.views?.[viewId]) return;
      workspaceState = switchView(workspaceState, viewId);
      navigationState = { currentView: workspaceState.currentView, selectedNode: workspaceState.selectedNode };
      renderDiagram(workspaceState.currentView);
    }

    function navigateUp() {
      viewAction({ type: "up" });
    }

    function selectNode(nodeId) {
      viewAction({ type: "select-node", nodeId });
    }

    function openNodeDrilldown(nodeId) {
      const next = openDrilldown(architectureModel, workspaceState, nodeId);
      if (next === workspaceState) return;
      workspaceState = next;
      navigationState = { currentView: next.currentView, selectedNode: next.selectedNode };
      renderDiagram(next.currentView);
    }

    function renderBreadcrumb(viewId) {
      const element = document.getElementById("breadcrumb");
      const trail = getBreadcrumbs(viewId);
      element.innerHTML = trail.map((id, index) => {
        const isCurrent = index === trail.length - 1;
        const button = `<button type="button" class="crumb" data-view-id="${id}"${isCurrent ? ' aria-current="page"' : ""}>${escapeHTML(VIEW_LABELS[id])}</button>`;
        return index === 0 ? button : `<span class="crumb-separator" aria-hidden="true">/</span>${button}`;
      }).join("");
      element.querySelectorAll("button[data-view-id]").forEach((button) => {
        button.addEventListener("click", () => navigateTo(button.dataset.viewId));
      });
    }

    function renderTopToolbar(view, state) {
      const kicker = document.getElementById("view-kicker");
      const title = document.getElementById("view-title");
      const description = document.getElementById("view-description");
      const backButton = document.getElementById("back-button");
      if (kicker) kicker.textContent = `C4 Level ${view.level} · ${view.title}`;
      if (title) title.textContent = view.scopeName;
      if (description) description.textContent = view.description;
      if (backButton) backButton.disabled = !getParentViewId(state.currentView);
      renderBreadcrumb(state.currentView);
    }

    function renderNavigationPanel(view, state) {
      const content = document.getElementById("left-panel-content");
      if (!content) return;
      content.innerHTML = buildLeftPanelMarkup(architectureModel, state);
    }

    function renderInspectorPanel() {
      const content = document.getElementById("inspector-content");
      if (!content) return;
      content.innerHTML = buildInspectorMarkup(architectureModel, workspaceState);
    }

    function getNextTabIndex(tabCount, currentIndex, key) {
      if (!Number.isInteger(tabCount) || tabCount < 1 || !Number.isInteger(currentIndex) || currentIndex < 0 || currentIndex >= tabCount) return null;
      if (key === "ArrowLeft") return (currentIndex - 1 + tabCount) % tabCount;
      if (key === "ArrowRight") return (currentIndex + 1) % tabCount;
      if (key === "Home") return 0;
      if (key === "End") return tabCount - 1;
      return null;
    }

    function bindRovingTablist(tablist, activateTab) {
      const tabs = [...tablist.querySelectorAll('[role="tab"]')];
      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => activateTab(tab));
        tab.addEventListener("keydown", (event) => {
          const nextIndex = getNextTabIndex(tabs.length, index, event.key);
          if (nextIndex === null) return;
          event.preventDefault();
          const nextTab = tabs[nextIndex];
          activateTab(nextTab);
          document.getElementById(nextTab.id)?.focus();
        });
      });
    }

    function bindRenderedControls() {
      document.querySelectorAll("#left-panel-content [role=tablist]").forEach((tablist) => bindRovingTablist(tablist, (tab) => updateWorkspace({ type: "set-left-tab", tab: tab.dataset.leftTab })));
      document.querySelectorAll("#left-panel-content [data-view-id]").forEach((button) => button.addEventListener("click", () => navigateTo(button.dataset.viewId)));
      document.querySelectorAll("#left-panel-content [data-node-id]").forEach((element) => {
        element.addEventListener("click", () => dispatchWorkspace({ type: "select-node", nodeId: element.dataset.nodeId }));
        element.addEventListener("dblclick", () => openNodeDrilldown(element.dataset.nodeId));
        element.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          openNodeDrilldown(element.dataset.nodeId);
        });
      });
      document.querySelectorAll("#inspector-content [role=tablist]").forEach((tablist) => bindRovingTablist(tablist, (tab) => updateWorkspace({ type: "set-inspector-tab", tab: tab.dataset.inspectorTab })));
      document.querySelectorAll("#inspector-content [data-open-node-id]").forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        openNodeDrilldown(button.dataset.openNodeId);
      }));
    }

    function setPanelAccessibility(panel, isOpen) {
      if (!panel) return;
      panel.inert = !isOpen;
      if (isOpen) {
        panel.removeAttribute("inert");
        panel.removeAttribute("aria-hidden");
        return;
      }
      panel.setAttribute("inert", "");
      panel.setAttribute("aria-hidden", "true");
    }

    function renderWorkspaceChrome() {
      if (typeof document === "undefined") return;
      const shell = document.getElementById("workspace");
      if (!shell) return;
      shell.dataset.leftOpen = String(workspaceState.leftPanelOpen);
      shell.dataset.rightOpen = String(workspaceState.rightPanelOpen);
      setPanelAccessibility(document.getElementById("left-panel"), workspaceState.leftPanelOpen);
      setPanelAccessibility(document.getElementById("right-inspector"), workspaceState.rightPanelOpen);
      const view = architectureModel?.views?.[workspaceState.currentView];
      if (view) {
        renderNavigationPanel(view, workspaceState);
        renderInspectorPanel();
        renderTopToolbar(view, workspaceState);
      }
      document.querySelectorAll("#diagram-world [data-node-id]").forEach((node) => {
        node.setAttribute("aria-pressed", String(node.dataset.nodeId === workspaceState.selectedNode));
      });
      document.querySelectorAll("[data-left-tab]").forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.leftTab === workspaceState.leftTab));
      });
      document.querySelectorAll("[data-inspector-tab]").forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.inspectorTab === workspaceState.inspectorTab));
      });
      document.querySelectorAll("[data-tool]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.tool === workspaceState.tool));
      });
      const leftToggle = document.getElementById("left-panel-toggle");
      const rightToggle = document.getElementById("right-panel-toggle");
      const toolbarLeftToggle = document.getElementById("toolbar-left-panel-toggle");
      const toolbarRightToggle = document.getElementById("toolbar-right-panel-toggle");
      if (leftToggle) {
        leftToggle.setAttribute("aria-expanded", String(workspaceState.leftPanelOpen));
        leftToggle.setAttribute("aria-label", workspaceState.leftPanelOpen ? "왼쪽 패널 닫기" : "왼쪽 패널 열기");
        leftToggle.textContent = workspaceState.leftPanelOpen ? "패널 닫기" : "패널 열기";
      }
      if (rightToggle) {
        rightToggle.setAttribute("aria-expanded", String(workspaceState.rightPanelOpen));
        rightToggle.setAttribute("aria-label", workspaceState.rightPanelOpen ? "인스펙터 닫기" : "인스펙터 열기");
      }
      if (toolbarLeftToggle) {
        toolbarLeftToggle.setAttribute("aria-expanded", String(workspaceState.leftPanelOpen));
        toolbarLeftToggle.setAttribute("aria-label", workspaceState.leftPanelOpen ? "왼쪽 패널 닫기" : "왼쪽 패널 열기");
      }
      if (toolbarRightToggle) {
        toolbarRightToggle.setAttribute("aria-expanded", String(workspaceState.rightPanelOpen));
        toolbarRightToggle.setAttribute("aria-label", workspaceState.rightPanelOpen ? "인스펙터 닫기" : "인스펙터 열기");
      }
      bindRenderedControls();
      scheduleCanvasCoordinateSync();
    }

    function resetViewportToFit() {
      const viewports = { ...workspaceState.viewports };
      delete viewports[workspaceState.currentView];
      workspaceState = { ...workspaceState, viewports };
      ensureViewportForCurrentView();
    }

    function shouldUseTemporaryHand(event, activeElement) {
      if (event.code !== "Space") return false;
      const tagName = activeElement?.tagName?.toUpperCase() ?? "";
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(tagName)) return false;
      return !activeElement?.closest?.("[data-node-id], button, [role=button], a[href]");
    }

    function bindToolbarActions() {
      document.querySelectorAll("[data-action]").forEach((button) => button.addEventListener("click", () => {
        const action = button.dataset.action;
        if (action === "fit-view") resetViewportToFit();
        if (action === "zoom-in") zoomBy(1.15);
        if (action === "zoom-out") zoomBy(1 / 1.15);
      }));
    }

    function bindViewportInteractions() {
      const viewport = document.getElementById("diagram-viewport");
      if (!viewport) return;
      let drag = null;
      let spaceHeld = false;

      viewport.addEventListener("wheel", (event) => {
        event.preventDefault();
        if (event.ctrlKey || event.metaKey) {
          const point = localPoint(event, viewport);
          setViewport(zoomViewportAt(currentViewport(), point, currentViewport().scale * Math.exp(-event.deltaY * 0.002)));
          return;
        }
        setViewport(panViewport(
          currentViewport(),
          event.shiftKey ? -event.deltaY : -event.deltaX,
          event.shiftKey ? 0 : -event.deltaY
        ));
      }, { passive: false });

      viewport.addEventListener("pointerdown", (event) => {
        const canPan = workspaceState.tool === "hand" || spaceHeld || event.button === 1;
        if (!canPan) return;
        event.preventDefault();
        viewport.setPointerCapture(event.pointerId);
        viewport.dataset.panning = "true";
        drag = { pointerId: event.pointerId, x: event.clientX, y: event.clientY };
      });
      viewport.addEventListener("pointermove", (event) => {
        if (!drag || drag.pointerId !== event.pointerId) return;
        setViewport(panViewport(currentViewport(), event.clientX - drag.x, event.clientY - drag.y));
        drag = { pointerId: event.pointerId, x: event.clientX, y: event.clientY };
      });
      const endDrag = (event) => {
        if (drag?.pointerId !== event.pointerId) return;
        if (viewport.hasPointerCapture?.(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        viewport.dataset.panning = "false";
        drag = null;
      };
      viewport.addEventListener("pointerup", endDrag);
      viewport.addEventListener("pointercancel", endDrag);

      window.addEventListener("keydown", (event) => {
        const editable = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName ?? "");
        if (shouldUseTemporaryHand(event, document.activeElement)) {
          event.preventDefault();
          spaceHeld = true;
          viewport.dataset.tool = "hand";
        }
        if ((event.metaKey || event.ctrlKey) && event.code === "Equal") { event.preventDefault(); zoomBy(1.15); }
        if ((event.metaKey || event.ctrlKey) && event.code === "Minus") { event.preventDefault(); zoomBy(1 / 1.15); }
        if ((event.metaKey || event.ctrlKey) && event.code === "Digit0") { event.preventDefault(); resetViewportToFit(); }
        if (!editable && event.key.toLowerCase() === "v") updateWorkspace({ type: "set-tool", tool: "select" });
        if (!editable && event.key.toLowerCase() === "h") updateWorkspace({ type: "set-tool", tool: "hand" });
      });
      window.addEventListener("keyup", (event) => {
        if (event.code !== "Space" || !spaceHeld) return;
        spaceHeld = false;
        viewport.dataset.tool = workspaceState.tool;
      });
    }

    function renderEvidence(nodeId) {
      const panel = document.getElementById("inspector-content") ?? document.getElementById("right-inspector");
      if (!panel) return;
      const node = nodeId ? getNodeById(architectureModel, workspaceState.currentView, nodeId) : null;
      if (node) {
        panel.innerHTML = buildEvidenceMarkup(node);
        return;
      }
      const view = architectureModel.views[workspaceState.currentView];
      const guidance = view.level < 3
        ? "화살표가 있는 파란 노드를 선택하면 다음 C4 수준으로 내려갑니다. 회색 노드는 시스템 경계 밖의 의존성입니다."
        : "컴포넌트를 선택하면 책임, 입력·출력, 그리고 실제 소스 파일 근거를 확인할 수 있습니다.";
      panel.innerHTML = `<div class="evidence-head"><p class="evidence-kicker">How to explore</p><h3 class="evidence-title">${escapeHTML(view.scopeName)}</h3><p class="evidence-meta">C4 Level ${view.level}</p></div><p class="evidence-empty">${escapeHTML(guidance)}</p>`;
    }

    function anchorFor(node, other, override) {
      if (override && Number.isFinite(override.x) && Number.isFinite(override.y)) return override;
      const center = { x: node.x + node.w / 2, y: node.y + node.h / 2 };
      const otherCenter = { x: other.x + other.w / 2, y: other.y + other.h / 2 };
      const dx = otherCenter.x - center.x;
      const dy = otherCenter.y - center.y;
      if (Math.abs(dx) >= Math.abs(dy)) {
        return { x: dx >= 0 ? node.x + node.w : node.x, y: center.y };
      }
      return { x: center.x, y: dy >= 0 ? node.y + node.h : node.y };
    }

    function isFinitePoint(point) {
      return Boolean(point) && Number.isFinite(point.x) && Number.isFinite(point.y);
    }

    function isPointOnNodeBoundary(point, node) {
      if (!isFinitePoint(point) || !node) return false;
      const withinX = point.x >= node.x && point.x <= node.x + node.w;
      const withinY = point.y >= node.y && point.y <= node.y + node.h;
      return (withinX && (point.y === node.y || point.y === node.y + node.h))
        || (withinY && (point.x === node.x || point.x === node.x + node.w));
    }

    function currentBoundaryAnchor(node, other, explicitAnchor) {
      const fallback = anchorFor(node, other);
      if (!isFinitePoint(explicitAnchor)) return fallback;
      const margin = Math.min(10, node.w / 4, node.h / 4);
      const clampX = Math.max(node.x + margin, Math.min(node.x + node.w - margin, explicitAnchor.x));
      const clampY = Math.max(node.y + margin, Math.min(node.y + node.h - margin, explicitAnchor.y));
      const candidates = [
        { distance: Math.abs(explicitAnchor.x - node.x), point: { x: node.x, y: clampY } },
        { distance: Math.abs(explicitAnchor.x - (node.x + node.w)), point: { x: node.x + node.w, y: clampY } },
        { distance: Math.abs(explicitAnchor.y - node.y), point: { x: clampX, y: node.y } },
        { distance: Math.abs(explicitAnchor.y - (node.y + node.h)), point: { x: clampX, y: node.y + node.h } }
      ];
      return candidates.sort((first, second) => first.distance - second.distance)[0].point;
    }

    function relationshipLaneOffset(relationshipId) {
      let hash = 2166136261;
      for (const character of relationshipId) hash = Math.imul(hash ^ character.charCodeAt(0), 16777619) >>> 0;
      return 8 + (hash % 3001) / 1000;
    }

    function relationshipPort(node, anchor, distance) {
      if (anchor.x === node.x) return { x: anchor.x - distance, y: anchor.y };
      if (anchor.x === node.x + node.w) return { x: anchor.x + distance, y: anchor.y };
      if (anchor.y === node.y) return { x: anchor.x, y: anchor.y - distance };
      return { x: anchor.x, y: anchor.y + distance };
    }

    function polylineSegments(points) {
      return points.slice(1).map((end, index) => ({ start: points[index], end }));
    }

    function relationshipPolyline(nodes, relationship) {
      const from = nodes.get(relationship.from);
      const to = nodes.get(relationship.to);
      if (!from || !to) return [];
      const start = currentBoundaryAnchor(from, to, relationship.sourceAnchor);
      const end = currentBoundaryAnchor(to, from, relationship.targetAnchor);
      const portDistance = relationshipLaneOffset(relationship.id);
      const routeStops = [
        start,
        relationshipPort(from, start, portDistance),
        ...(relationship.waypoints ?? []).filter(isFinitePoint),
        relationshipPort(to, end, portDistance),
        end
      ]
        .filter((point, index, all) => index === 0 || point.x !== all[index - 1].x || point.y !== all[index - 1].y);
      const path = [];
      const forbiddenSegments = [];
      for (let index = 1; index < routeStops.length; index += 1) {
        const leg = findObstacleFreePath(nodes, relationship, routeStops[index - 1], routeStops[index], 8, forbiddenSegments);
        if (leg.length < 2) return [];
        path.push(...(index === 1 ? leg : leg.slice(1)));
        forbiddenSegments.push(...polylineSegments(leg));
      }
      const deduplicated = path.filter((point, index) => index === 0 || point.x !== path[index - 1].x || point.y !== path[index - 1].y);
      return simplifyOrthogonalPath(deduplicated);
    }

    function relationshipPath(points) {
      const safePoints = points.filter(isFinitePoint);
      if (safePoints.length < 2) return "";
      return safePoints.reduce((path, point, index) => `${path}${index ? " L" : "M"} ${point.x} ${point.y}`, "");
    }

    function pointInRect(point, rect) {
      return point.x >= rect.left && point.x <= rect.right && point.y >= rect.top && point.y <= rect.bottom;
    }

    function orientation(a, b, c) {
      return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    }

    function positiveCollinearOverlapLength(a, b, c, d) {
      const firstHorizontal = a.y === b.y;
      const secondHorizontal = c.y === d.y;
      if (firstHorizontal !== secondHorizontal) return 0;
      if (firstHorizontal) {
        if (a.y !== c.y) return 0;
        return Math.max(0, Math.min(Math.max(a.x, b.x), Math.max(c.x, d.x))
          - Math.max(Math.min(a.x, b.x), Math.min(c.x, d.x)));
      }
      if (a.x !== b.x || c.x !== d.x || a.x !== c.x) return 0;
      return Math.max(0, Math.min(Math.max(a.y, b.y), Math.max(c.y, d.y))
        - Math.max(Math.min(a.y, b.y), Math.min(c.y, d.y)));
    }

    function segmentsIntersect(a, b, c, d) {
      const abC = orientation(a, b, c);
      const abD = orientation(a, b, d);
      const cdA = orientation(c, d, a);
      const cdB = orientation(c, d, b);
      const onSegment = (start, point, end) => point.x >= Math.min(start.x, end.x) && point.x <= Math.max(start.x, end.x)
        && point.y >= Math.min(start.y, end.y) && point.y <= Math.max(start.y, end.y);
      if (abC === 0 && abD === 0 && cdA === 0 && cdB === 0) {
        return Math.max(Math.min(a.x, b.x), Math.min(c.x, d.x)) <= Math.min(Math.max(a.x, b.x), Math.max(c.x, d.x))
          && Math.max(Math.min(a.y, b.y), Math.min(c.y, d.y)) <= Math.min(Math.max(a.y, b.y), Math.max(c.y, d.y));
      }
      if (abC === 0 && onSegment(a, c, b)) return true;
      if (abD === 0 && onSegment(a, d, b)) return true;
      if (cdA === 0 && onSegment(c, a, d)) return true;
      if (cdB === 0 && onSegment(c, b, d)) return true;
      return (abC > 0) !== (abD > 0) && (cdA > 0) !== (cdB > 0);
    }

    function segmentIntersectsRect(start, end, node, padding = 0) {
      const rect = { left: node.x - padding, right: node.x + node.w + padding, top: node.y - padding, bottom: node.y + node.h + padding };
      if (pointInRect(start, rect) || pointInRect(end, rect)) return true;
      const corners = [
        { x: rect.left, y: rect.top }, { x: rect.right, y: rect.top },
        { x: rect.right, y: rect.bottom }, { x: rect.left, y: rect.bottom }
      ];
      return corners.some((corner, index) => segmentsIntersect(start, end, corner, corners[(index + 1) % corners.length]));
    }

    function pathCrossesUnrelatedNodes(nodes, relationship, points, padding = 0) {
      const unrelated = [...nodes.values()].filter((node) => ![relationship.from, relationship.to].includes(node.id));
      return unrelated.some((node) => points.slice(1).some((point, index) => segmentIntersectsRect(points[index], point, node, padding)));
    }

    function segmentTraversesNodeInterior(start, end, node) {
      const intervalInside = (origin, delta, lower, upper) => {
        if (delta === 0) return origin > lower && origin < upper ? [-Infinity, Infinity] : [Infinity, -Infinity];
        const first = (lower - origin) / delta;
        const second = (upper - origin) / delta;
        return [Math.min(first, second), Math.max(first, second)];
      };
      const xInterval = intervalInside(start.x, end.x - start.x, node.x, node.x + node.w);
      const yInterval = intervalInside(start.y, end.y - start.y, node.y, node.y + node.h);
      const enter = Math.max(0, xInterval[0], yInterval[0]);
      const leave = Math.min(1, xInterval[1], yInterval[1]);
      return enter < leave;
    }

    function simplifyOrthogonalPath(points) {
      let result = points;
      while (true) {
        const nextResult = result.filter((point, index) => {
          if (index === 0 || index === result.length - 1) return true;
          const previous = result[index - 1];
          const next = result[index + 1];
          const liesBetween = (value, first, second) => value >= Math.min(first, second) && value <= Math.max(first, second);
          return !((previous.x === point.x && point.x === next.x && liesBetween(point.y, previous.y, next.y))
            || (previous.y === point.y && point.y === next.y && liesBetween(point.x, previous.x, next.x)));
        });
        if (nextResult.length === result.length) return result;
        result = nextResult;
      }
    }

    function findObstacleFreePath(nodes, relationship, start, end, padding = 8, forbiddenSegments = []) {
      const source = nodes.get(relationship.from);
      const target = nodes.get(relationship.to);
      const endpointNodes = [source, target].filter(Boolean);
      const unrelated = [...nodes.values()].filter((node) => ![relationship.from, relationship.to].includes(node.id));
      const clearance = padding + 2 + relationshipLaneOffset(relationship.id);
      const xValues = [
        start.x,
        end.x,
        ...endpointNodes.flatMap((node) => [node.x - clearance, node.x + node.w + clearance]),
        ...unrelated.flatMap((node) => [node.x - clearance, node.x + node.w + clearance])
      ];
      const yValues = [
        start.y,
        end.y,
        ...endpointNodes.flatMap((node) => [node.y - clearance, node.y + node.h + clearance]),
        ...unrelated.flatMap((node) => [node.y - clearance, node.y + node.h + clearance])
      ];
      const xs = [...new Set(xValues)].sort((a, b) => a - b);
      const ys = [...new Set(yValues)].sort((a, b) => a - b);
      const points = [];
      for (const y of ys) for (const x of xs) {
        const point = { x, y };
        const insideUnrelated = unrelated.some((node) => pointInRect(point, { left: node.x - padding, right: node.x + node.w + padding, top: node.y - padding, bottom: node.y + node.h + padding }));
        const insideEndpoint = endpointNodes.some((node) => point.x > node.x && point.x < node.x + node.w && point.y > node.y && point.y < node.y + node.h);
        if (!insideUnrelated && !insideEndpoint) points.push(point);
      }
      const startIndex = points.findIndex((point) => point.x === start.x && point.y === start.y);
      const endIndex = points.findIndex((point) => point.x === end.x && point.y === end.y);
      if (startIndex < 0 || endIndex < 0) return [start, end];
      const distance = new Array(points.length).fill(Infinity);
      const previous = new Array(points.length).fill(-1);
      const visited = new Set();
      distance[startIndex] = 0;
      while (visited.size < points.length) {
        let current = -1;
        for (let index = 0; index < points.length; index += 1) if (!visited.has(index) && (current < 0 || distance[index] < distance[current])) current = index;
        if (current < 0 || !Number.isFinite(distance[current]) || current === endIndex) break;
        visited.add(current);
        for (let index = 0; index < points.length; index += 1) {
          if (visited.has(index) || index === current) continue;
          const a = points[current]; const b = points[index];
          if (a.x !== b.x && a.y !== b.y) continue;
          if (unrelated.some((node) => segmentIntersectsRect(a, b, node, padding))) continue;
          if (endpointNodes.some((node) => segmentTraversesNodeInterior(a, b, node))) continue;
          if (forbiddenSegments.some((segment) => positiveCollinearOverlapLength(a, b, segment.start, segment.end) > 0)) continue;
          const candidate = distance[current] + Math.abs(a.x - b.x) + Math.abs(a.y - b.y) + 1;
          if (candidate < distance[index]) { distance[index] = candidate; previous[index] = current; }
        }
      }
      if (!Number.isFinite(distance[endIndex])) return [];
      const path = [];
      for (let cursor = endIndex; cursor >= 0; cursor = previous[cursor]) { path.unshift(points[cursor]); if (cursor === startIndex) break; }
      return simplifyOrthogonalPath(path);
    }

    function relationshipTraversesUnrelatedNode(nodes, relationship, padding = 0) {
      const points = relationshipPolyline(nodes, relationship);
      const unrelated = [...nodes.values()].filter((node) => ![relationship.from, relationship.to].includes(node.id));
      return unrelated.filter((node) => points.slice(1).some((point, index) => segmentIntersectsRect(points[index], point, node, padding))).map((node) => node.id);
    }

    function relationshipLabelPoint(points, override) {
      if (override && Number.isFinite(override.x) && Number.isFinite(override.y)) return projectPointToPolyline(override, points);
      if (points.length < 2) return { x: 0, y: 0 };
      let longest = { length: -1, start: points[0], end: points[1] };
      for (let index = 1; index < points.length; index += 1) {
        const start = points[index - 1];
        const end = points[index];
        const length = Math.hypot(end.x - start.x, end.y - start.y);
        if (length > longest.length) longest = { length, start, end };
      }
      return { x: (longest.start.x + longest.end.x) / 2, y: (longest.start.y + longest.end.y) / 2 };
    }

    function projectPointToSegment(point, start, end) {
      const dx = end.x - start.x; const dy = end.y - start.y;
      const lengthSquared = dx * dx + dy * dy;
      if (lengthSquared === 0) return { x: start.x, y: start.y };
      const ratio = Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.y - start.y) * dy) / lengthSquared));
      return { x: start.x + dx * ratio, y: start.y + dy * ratio };
    }

    function pointToPolylineDistance(point, points) {
      if (points.length < 2) return Infinity;
      return Math.min(...points.slice(1).map((end, index) => {
        const projected = projectPointToSegment(point, points[index], end);
        return Math.hypot(point.x - projected.x, point.y - projected.y);
      }));
    }

    function projectPointToPolyline(point, points) {
      if (points.length < 2) return { x: 0, y: 0 };
      let nearest = projectPointToSegment(point, points[0], points[1]);
      let distance = Math.hypot(point.x - nearest.x, point.y - nearest.y);
      for (let index = 1; index < points.length; index += 1) {
        const candidate = projectPointToSegment(point, points[index - 1], points[index]);
        const candidateDistance = Math.hypot(point.x - candidate.x, point.y - candidate.y);
        if (candidateDistance < distance) { nearest = candidate; distance = candidateDistance; }
      }
      return nearest;
    }

    function getRelationshipLabelLayout(relationship) {
      const maxTextWidth = 250;
      const descriptionLines = wrapSvgText(relationship.description, maxTextWidth, 12);
      const technologyLines = relationship.technology ? wrapSvgText(`[${relationship.technology}]`, maxTextWidth, 10) : [];
      const widestLine = Math.max(
        ...descriptionLines.map((line) => estimateSvgTextWidth(line, 12)),
        ...technologyLines.map((line) => estimateSvgTextWidth(line, 10)),
        118
      );
      return {
        descriptionLines,
        technologyLines,
        width: Math.max(148, Math.min(280, widestLine + 30)),
        height: descriptionLines.length * 16 + technologyLines.length * 13 + (technologyLines.length ? 3 : 0) + 14
      };
    }

    function buildRelationshipMarkup(nodes, relationship) {
      const points = relationshipPolyline(nodes, relationship);
      if (points.length < 2) return "";
      const label = relationshipLabelPoint(points, relationship.labelPosition);
      const statusClass = relationship.status === "gap" ? " status-gap" : "";
      const { descriptionLines, technologyLines, width: labelWidth, height: labelHeight } = getRelationshipLabelLayout(relationship);
      const descriptionStart = -labelHeight / 2 + 19;
      const technologyY = descriptionStart + (descriptionLines.length - 1) * 16 + 15;
      const descriptionText = `<text class="relationship-description" aria-label="${escapeHTML(relationship.description)}" x="0" y="${descriptionStart}" text-anchor="middle">${descriptionLines.map((line, index) =>
        `<tspan x="0" dy="${index ? 16 : 0}">${escapeHTML(line)}</tspan>`
      ).join("")}</text>`;
      const technologyText = technologyLines.length
        ? `<text class="relationship-technology" x="0" y="${technologyY}" text-anchor="middle">${technologyLines.map((line, index) =>
          `<tspan x="0" dy="${index ? 13 : 0}">${escapeHTML(line)}</tspan>`
        ).join("")}</text>`
        : "";
      return `<g class="relationship${statusClass}" data-relationship-id="${escapeHTML(relationship.id)}">
        <path class="relationship-path${statusClass}" d="${relationshipPath(points)}" marker-end="url(#arrow${relationship.status === "gap" ? "-gap" : ""})"/>
        <g class="relationship-label" transform="translate(${label.x} ${label.y})">
          <rect class="relationship-label-surface" x="${-labelWidth / 2}" y="${-labelHeight / 2}" width="${labelWidth}" height="${labelHeight}" rx="8"/>
          ${descriptionText}${technologyText}
        </g>
      </g>`;
    }

    const ARROW_MARKERS = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7f91a3"/></marker><marker id="arrow-gap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a45a08"/></marker></defs>`;

    function drawRelationships(view) {
      const svg = document.getElementById("diagram-svg") ?? document.getElementById("relationship-layer");
      if (!svg) return;
      const nodes = new Map(view.nodes.map((node) => [node.id, node]));
      const relationshipLayer = svg.querySelector("#diagram-world .relationship-layer");
      const relationshipMarkup = `${ARROW_MARKERS}${view.relationships.map((relationship) => buildRelationshipMarkup(nodes, relationship)).join("")}`;
      if (relationshipLayer) relationshipLayer.innerHTML = relationshipMarkup;
      else svg.innerHTML = relationshipMarkup;
    }

    function updateLayoutMode() {
      document.body.dataset.layout = getLayoutMode(window.innerWidth);
      if (architectureModel) {
        workspaceState = normalizePanelsForWidth(workspaceState, window.innerWidth, workspaceState.rightPanelOpen ? "right" : "left");
        renderWorkspaceChrome();
        syncSvgCoordinateSystem();
        drawRelationships(architectureModel.views[workspaceState.currentView]);
        setViewport(currentViewport());
      }
    }

    function renderDiagram(viewId) {
      const view = architectureModel.views[viewId];
      if (!view) return;
      workspaceState = { ...workspaceState, currentView: viewId };
      navigationState = { currentView: viewId, selectedNode: workspaceState.selectedNode };
      syncSvgCoordinateSystem();
      renderWorkspaceChrome();

      const diagramWorld = document.getElementById("diagram-world");
      if (!diagramWorld) return;
      diagramWorld.innerHTML = renderSvgWorld(view, workspaceState);
      diagramWorld.querySelectorAll("[data-node-id]").forEach((node) => {
        node.addEventListener("click", () => dispatchWorkspace({ type: "select-node", nodeId: node.dataset.nodeId }));
        node.addEventListener("dblclick", () => openNodeDrilldown(node.dataset.nodeId));
        node.addEventListener("keydown", (event) => {
          if (event.key === " ") {
            event.preventDefault();
            dispatchWorkspace({ type: "select-node", nodeId: node.dataset.nodeId });
            return;
          }
          if (event.key !== "Enter") return;
          event.preventDefault();
          openNodeDrilldown(node.dataset.nodeId);
        });
      });
      diagramWorld.querySelectorAll("[data-open-node-id]").forEach((button) => button.addEventListener("click", (event) => {
        event.stopPropagation();
        openNodeDrilldown(button.dataset.openNodeId);
      }));
      drawRelationships(view);
      ensureViewportForCurrentView();
    }

    function boot() {
      architectureModel = JSON.parse(document.getElementById("architecture-model").textContent);
      const validation = validateModel(architectureModel);
      if (!validation.valid) {
        console.error("Invalid C4 architecture model", validation.errors);
        document.getElementById("inspector-content").innerHTML = '<p class="evidence-empty" role="alert">아키텍처 모델을 불러오지 못했습니다.</p>';
        return;
      }
      document.getElementById("back-button").addEventListener("click", navigateUp);
      document.getElementById("left-panel-toggle").addEventListener("click", () => dispatchWorkspace({ type: "toggle-left-panel" }));
      document.getElementById("right-panel-toggle").addEventListener("click", () => dispatchWorkspace({ type: "toggle-right-panel" }));
      document.getElementById("toolbar-left-panel-toggle").addEventListener("click", () => dispatchWorkspace({ type: "toggle-left-panel" }));
      document.getElementById("toolbar-right-panel-toggle").addEventListener("click", () => dispatchWorkspace({ type: "toggle-right-panel" }));
      document.querySelectorAll("[data-left-tab]").forEach((button) => button.addEventListener("click", () => dispatchWorkspace({ type: "set-left-tab", tab: button.dataset.leftTab })));
      document.querySelectorAll("[data-tool]").forEach((button) => button.addEventListener("click", () => updateWorkspace({ type: "set-tool", tool: button.dataset.tool })));
      bindToolbarActions();
      bindViewportInteractions();
      renderDiagram(navigationState.currentView);
      updateLayoutMode();
      window.addEventListener("resize", updateLayoutMode);
      window.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        dispatchWorkspace({ type: "clear-selection" });
      });
    }

    window.RhythmC4Explorer = {
      validateModel,
      getParentViewId,
      getBreadcrumbs,
      getNodeById,
      createWorkspaceState,
      reduceWorkspace,
      normalizePanelsForWidth,
      createNavigationState,
      reduceNavigation,
      getPersonGeometry,
      buildShapeGeometry,
      estimateSvgTextWidth,
      wrapSvgText,
      getNodeTextBounds,
      getSvgTextLayout,
      buildSvgNodeMarkup,
      getBoundaryLabelBounds,
      buildBoundaryMarkup,
      renderSvgWorld,
      buildEvidenceMarkup,
      buildViewsMarkup,
      buildLayersMarkup,
      buildLeftPanelMarkup,
      buildInspectorMarkup,
      switchView,
      openDrilldown,
      renderTopToolbar,
      getNextTabIndex,
      bindRovingTablist,
      bindRenderedControls,
      setPanelAccessibility,
      getLayoutMode,
      anchorFor,
      isPointOnNodeBoundary,
      relationshipPolyline,
      relationshipPath,
      segmentsIntersect,
      positiveCollinearOverlapLength,
      segmentIntersectsRect,
      segmentTraversesNodeInterior,
      relationshipTraversesUnrelatedNode,
      relationshipLabelPoint,
      pointToPolylineDistance,
      getRelationshipLabelLayout,
      buildRelationshipMarkup,
      clampScale,
      panViewport,
      zoomViewportAt,
      fitViewport,
      constrainViewport,
      localPoint,
      currentViewport,
      currentViewportFrame,
      syncSvgCoordinateSystem,
      scheduleCanvasCoordinateSync,
      setViewport,
      applyViewportTransform,
      ensureViewportForCurrentView,
      renderCanvasTools,
      updateWorkspace,
      shouldUseTemporaryHand,
      bindToolbarActions,
      bindViewportInteractions,
      navigateTo,
      navigateUp,
      selectNode,
      renderDiagram,
      renderEvidence,
      drawRelationships
    };

    if (typeof document !== "undefined") boot();
  })();
  </script>
</body>
