  <style>
    :root {
      color-scheme: light;
      --page: #f3f6f9;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --ink: #152535;
      --muted: #5d6b78;
      --line: #cfd8e2;
      --line-strong: #7f91a3;
      --blue: #16669a;

      --gap-soft: #fff4df;

      --space-1: .5rem;

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    .workspace-shell {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: var(--left-column, 17.5rem) minmax(0, 1fr) var(--right-column, 0rem);
      background: var(--canvas-background);
    }
    .workspace-shell[data-left-open="false"] { --left-column: 0rem; }
    .workspace-shell[data-right-open="true"] { --right-column: 21rem; }
    .canvas-region { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    .diagram-viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
    .diagram-viewport[data-panning="true"] { cursor: grabbing; }
    .diagram-viewport[data-tool="hand"] { cursor: grab; }
    .diagram-svg { width: 100%; height: 100%; display: block; }

    .side-panel {
      min-width: 0;

      border-color: var(--line);
      background: var(--surface);
      color: var(--ink);
    }
    .left-panel { border-right: 1px solid var(--line); }

    .panel-heading, .inspector-toolbar { padding: 1.25rem; }

    .panel-title { margin: .2rem 0 .85rem; font-size: 1.05rem; }
    .panel-toggle { border: 1px solid var(--line); border-radius: .45rem; padding: .4rem .6rem; background: var(--surface-soft); color: var(--ink); cursor: pointer; }
    .panel-tabs { display: flex; gap: .25rem; padding: .75rem 1rem 0; }
    .panel-tab { border: 0; border-bottom: 2px solid transparent; padding: .45rem .55rem; background: transparent; color: var(--muted); cursor: pointer; }
    .panel-tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--blue-deep); font-weight: 700; }
    .panel-content { display: grid; gap: .5rem; padding: 1rem; }
    .view-list, .layer-groups { display: grid; gap: .5rem; }

    .view-list button[aria-current="page"], .layer-groups button[aria-current="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }

    .inspector-tabs { display: flex; gap: .35rem; flex-wrap: wrap; margin: 1rem 1rem .75rem; }
    .inspector-tabs button { padding: .38rem .55rem; border: 1px solid var(--line); border-radius: .45rem; background: var(--surface); color: var(--muted); text-transform: capitalize; }
    .inspector-tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
    .inspector-tabpanel { display: grid; gap: .75rem; padding: 0 1rem 1rem; }
    .inspector-tabpanel h2, .inspector-tabpanel h3, .inspector-tabpanel p { margin: 0; }
    .inspector-tabpanel section { display: grid; gap: .35rem; }
    .flow-item { display: grid; gap: .25rem; padding: .65rem; border: 1px solid var(--line); border-radius: .55rem; }
    .overview-evidence { display: grid; gap: .35rem; }
    .panel-note { margin: 1rem; color: var(--muted); font-size: .78rem; line-height: 1.55; }
    .top-toolbar { position: relative; z-index: 3; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: .85rem; align-items: center; min-height: 4.5rem; padding: .75rem 1rem; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(16px); }
    .toolbar-context { min-width: 0; }
    .toolbar-context .view-kicker, .toolbar-context .view-title, .toolbar-context .view-description { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toolbar-context .view-kicker { margin: 0; }
    .toolbar-context .view-title { margin: .1rem 0 0; font-size: 1.05rem; }
    .toolbar-context .view-description { margin: .1rem 0 0; font-size: .75rem; }
    .toolbar-actions { display: flex; gap: .35rem; }
    .toolbar-action { width: 2.25rem; height: 2.25rem; border: 1px solid var(--line); border-radius: .45rem; background: var(--surface); color: var(--ink); cursor: pointer; }
    .toolbar-action[aria-expanded="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-deep); }
    .canvas-tools { position: absolute; z-index: 4; right: 1rem; bottom: 1rem; display: flex; gap: .35rem; padding: .3rem; border: 1px solid var(--line); border-radius: .55rem; background: var(--surface); box-shadow: var(--shadow); }
    .canvas-tool { width: 2rem; height: 2rem; border: 0; border-radius: .35rem; background: transparent; color: var(--ink); cursor: pointer; }
    .canvas-tool[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue-deep); }
    .canvas-zoom-value { display: inline-grid; min-width: 3.2rem; place-items: center; color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
    .canvas-legend { position: absolute; z-index: 3; left: 1rem; bottom: 1rem; display: flex; gap: .75rem; padding: .45rem .6rem; border: 1px solid var(--line); border-radius: .55rem; background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--muted); font-size: .7rem; }
    .canvas-legend span { display: inline-flex; gap: .3rem; align-items: center; }
    .canvas-legend .legend-swatch { display: inline-block; width: .65rem; height: .65rem; border-radius: .15rem; }
    .inspector-toolbar { display: flex; justify-content: space-between; gap: .5rem; align-items: start; border-bottom: 1px solid var(--line); }
    #inspector-content { height: calc(100% - 5.25rem); overflow: auto; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .fallback-summary { padding: 1rem; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-optical-sizing: auto;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    button:not(:disabled) { -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .app-shell { min-height: 100vh; }

    .topbar {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) auto;
      gap: var(--space-5);
      align-items: end;
      padding: 40px clamp(32px, 5vw, 72px) 32px;
      color: #fff;
      background: linear-gradient(115deg, #0e3658, #12628f 66%, #1a739f);
    }

    .eyebrow {
      margin: 0 0 var(--space-1);
      color: #b9dff3;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .brand-title { margin: 0; font-size: clamp(28px, 3vw, 40px); line-height: 1.08; letter-spacing: -0.035em; }
    .brand-copy { margin: var(--space-2) 0 0; max-width: 760px; color: #d8ecf7; font-size: 15px; line-height: 1.7; }

    .level-nav { display: flex; gap: var(--space-1); align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .level-step {
      min-width: 88px;
      min-height: 50px;
      padding: 11px 14px;
      border: 1px solid rgba(255,255,255,.28);

    }
    .level-step strong, .level-step span { display: block; }

    .level-step[aria-current="step"] { border-color: #fff; background: #fff; color: var(--blue-deep); box-shadow: 0 8px 24px rgba(4, 31, 52, .16); }
    .level-step:disabled { opacity: .46; cursor: not-allowed; }
    .level-step:not(:disabled):active { transform: scale(.97); transition-duration: 80ms; }

    .workspace { width: min(100%, 1680px); margin: 0 auto; padding: 32px clamp(24px, 3vw, 48px) 56px; }
    .toolbar {
      position: sticky;
      top: 8px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 52px;
      padding: 8px 12px;
      border: 1px solid rgba(207, 216, 226, .78);
      border-radius: 14px;
      background: rgba(243, 246, 249, .82);
      box-shadow: 0 10px 32px rgba(32, 56, 78, .08);
      backdrop-filter: blur(20px) saturate(160%);

    }
    .back-button {
      border: 1px solid var(--line);

      padding: 9px 14px;

      color: var(--ink);
      cursor: pointer;
      transition: transform 100ms ease-out, background-color 160ms ease;
    }
    .back-button:disabled { opacity: .45; cursor: default; }
    .back-button:not(:disabled):active, .crumb:not([aria-current="page"]):active { transform: scale(.97); transition-duration: 80ms; }

    .breadcrumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .crumb {
      border: 0;
      padding: 7px 8px;
      background: transparent;
      color: var(--blue-deep);
      cursor: pointer;
      transition: transform 100ms ease-out, color 160ms ease;
    }
    .crumb[aria-current="page"] { color: var(--ink); font-weight: 700; cursor: default; }
    .crumb-separator { color: var(--line-strong); }

    .view-intro {
      display: flex;
      justify-content: space-between;
      gap: var(--space-5);
      align-items: end;
      margin: 28px 0;
    }
    .view-kicker { margin: 0 0 var(--space-1); color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .view-title { margin: 0; font-size: clamp(28px, 2.7vw, 40px); line-height: 1.12; letter-spacing: -.035em; }
    .view-description { margin: var(--space-2) 0 0; max-width: 840px; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .scope-chip { flex: 0 0 auto; border-left: 3px solid var(--blue); padding: 7px 0 7px 14px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .scope-chip strong { display: block; margin-top: 2px; color: var(--ink); }

    .explorer-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 320px); gap: 28px; align-items: start; }
    .diagram-panel, .evidence-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
    .diagram-panel { padding: 24px; min-width: 0; }

    .diagram-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1020 / 640;
      min-height: 540px;
      overflow: hidden;
      border-radius: 16px;
      background-color: var(--surface-soft);
      background-image: radial-gradient(circle, #d8e0e8 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .c4-boundary rect { fill: rgba(22, 102, 154, .045); stroke: var(--blue-deep); stroke-width: 2; stroke-dasharray: 12 8; }
    .c4-boundary text { fill: var(--blue-deep); font-size: 16px; font-weight: 750; }
    .c4-boundary .boundary-type { fill: var(--muted); font-size: 12px; font-weight: 650; }
    .relationship-layer { pointer-events: none; }
    .diagram-node { cursor: pointer; outline: none; }
    .diagram-node .node-surface, .diagram-node .semantic-person-head { fill: var(--blue); stroke: rgba(0,0,0,.12); stroke-width: 1.5; }
    .diagram-node .semantic-file-fold, .diagram-node .semantic-store-top, .diagram-node .semantic-store-bottom, .diagram-node .semantic-app-chrome, .diagram-node .semantic-device-cue, .diagram-node .semantic-component-cue { fill: none; stroke: rgba(255,255,255,.76); stroke-width: 2; }
    .diagram-node .semantic-app-chrome + circle, .diagram-node .semantic-app-chrome + circle + circle, .diagram-node .semantic-app-chrome + circle + circle + circle { fill: rgba(255,255,255,.76); }
    .diagram-node.status-person .node-surface, .diagram-node.status-person .semantic-person-head { fill: var(--person); }
    .diagram-node.status-external .node-surface, .diagram-node.status-external .semantic-person-head { fill: var(--external); }
    .diagram-node.status-gap .node-surface, .diagram-node.status-gap .semantic-person-head { fill: var(--gap-soft); stroke: var(--gap); stroke-width: 2; stroke-dasharray: 7 6; }
    .diagram-node.status-gap .semantic-file-fold, .diagram-node.status-gap .semantic-store-top, .diagram-node.status-gap .semantic-store-bottom, .diagram-node.status-gap .semantic-app-chrome, .diagram-node.status-gap .semantic-device-cue, .diagram-node.status-gap .semantic-component-cue { stroke: var(--gap); }
    .diagram-node .node-name { fill: #fff; font-size: var(--node-name-size, 16px); font-weight: 750; letter-spacing: -.01em; }
    .diagram-node .node-meta { fill: rgba(255,255,255,.86); font-size: var(--node-meta-size, 10px); }
    .diagram-node .node-description { fill: rgba(255,255,255,.94); font-size: var(--node-description-size, 12px); }
    .diagram-node .node-open text, .diagram-node .node-status { fill: #fff; font-size: 10px; font-weight: 800; }
    .diagram-node.status-gap .node-name, .diagram-node.status-gap .node-meta, .diagram-node.status-gap .node-description, .diagram-node.status-gap .node-open text, .diagram-node.status-gap .node-status { fill: #6e3a04; }
    .diagram-node[aria-pressed="true"] .node-surface, .diagram-node[aria-pressed="true"] .semantic-person-head, .diagram-node:focus-visible .node-surface, .diagram-node:focus-visible .semantic-person-head { stroke: var(--focus); stroke-width: 4; }

    .relationship-path { fill: none; stroke: var(--line-strong); stroke-width: 1.8; }
    .relationship-path.status-gap { stroke: var(--gap); stroke-dasharray: 7 6; }
    .relationship-label-surface { fill: rgba(255,255,255,.96); stroke: var(--line); stroke-width: 1; }
    .relationship.status-gap .relationship-label-surface { fill: var(--gap-soft); stroke: var(--gap); stroke-dasharray: 5 4; }
    .relationship-description { fill: var(--ink); font-size: 12px; font-weight: 700; }
    .relationship-technology { fill: var(--muted); font-size: 10px; font-weight: 550; }
    .relationship.status-gap .relationship-description, .relationship.status-gap .relationship-technology { fill: #6e3a04; }

    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .legend-item { display: inline-flex; gap: 6px; align-items: center; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; background: var(--blue); }
    .legend-swatch.person { background: var(--person); }
    .legend-swatch.external { background: var(--external); }
    .legend-swatch.gap { border: 2px dashed var(--gap); background: var(--gap-soft); }

    .evidence-panel { position: sticky; top: 24px; overflow: hidden; }
    .evidence-head { padding: 24px 26px; color: #fff; background: var(--blue-deep); }
    .evidence-kicker { margin: 0; color: #bfe1f2; font-size: 11px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
    .evidence-title { margin: 8px 0 0; font-size: 22px; line-height: 1.18; letter-spacing: -.02em; }
    .evidence-meta { margin: 7px 0 0; color: #d6ebf6; font-size: 12px; line-height: 1.5; }
    .evidence-body { padding: 24px 26px 30px; }
    .evidence-description { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.72; }
    .evidence-section { margin-top: 28px; }
    .evidence-section h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; }
    .evidence-section ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .evidence-files { display: grid; gap: 8px; }
    .evidence-files code { display: block; padding: 9px 10px; border-radius: 8px; background: #edf2f6; color: #24435a; font-size: 11px; line-height: 1.35; overflow-wrap: anywhere; }
    .status-note { margin: 18px 0 0; padding: 12px 14px; border-left: 3px solid var(--gap); background: var(--gap-soft); color: #6e3a04; font-size: 12px; line-height: 1.6; }
    .evidence-empty { padding: 30px 26px 36px; color: var(--muted); font-size: 15px; line-height: 1.75; }

    .provenance {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 32px;
      align-items: start;
      padding: 30px clamp(32px, 5vw, 72px) 36px;
      border-top: 1px solid #294861;
      background: #102d43;
      color: #c5d8e4;
      font-size: 12px;
      line-height: 1.6;
    }
    .provenance p { margin: 0; }
    .provenance code { color: #edf8ff; overflow-wrap: anywhere; }
    .provenance strong { color: #fff; }

    @media (max-width: 980px) {
      .topbar { grid-template-columns: 1fr; align-items: start; }
      .level-nav { justify-content: flex-start; }
      .explorer-grid { grid-template-columns: minmax(0, 1fr) minmax(250px, 300px); }
      .diagram-stage { min-height: 460px; }
    }

    @media (max-width: 760px) {
      .topbar { padding: 28px 20px 24px; gap: 22px; }
      .brand-title { font-size: clamp(27px, 8vw, 34px); }
      .brand-copy { margin-top: 10px; font-size: 14px; line-height: 1.72; }
      .level-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; gap: 8px; }
      .level-step { min-width: 0; min-height: 54px; padding: 10px 8px; }
      .workspace { padding: 20px 16px 40px; }
      .toolbar { top: 6px; align-items: flex-start; gap: 10px; padding: 8px 10px; }
      .back-button { min-height: 40px; padding-inline: 12px; }
      .breadcrumb { gap: 4px; font-size: 12px; line-height: 1.5; }
      .view-intro { display: block; margin: 24px 0; }
      .view-title { font-size: clamp(27px, 8vw, 34px); }
      .view-description { margin-top: 10px; font-size: 15px; line-height: 1.75; }
      .scope-chip { margin-top: 20px; padding-block: 8px; }
      .explorer-grid { grid-template-columns: 1fr; gap: 24px; }
      .diagram-panel { padding: 16px; border-radius: 16px; }
      .diagram-stage { min-height: 0; aspect-ratio: auto; overflow: visible; background-size: 16px 16px; }
      .legend { gap: 12px; font-size: 11px; }
      .evidence-panel { position: static; }
      .evidence-head { padding: 24px 22px; }
      .evidence-body { padding: 24px 22px 30px; }
      .evidence-empty { padding: 28px 22px 34px; }
      .provenance { grid-template-columns: 1fr; padding: 28px 20px 32px; gap: 20px; }
    }

    @media (prefers-reduced-transparency: reduce) {
      .toolbar { background: var(--page); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }

    @media (prefers-contrast: more) {
      .toolbar, .diagram-panel, .evidence-panel { border-color: var(--ink); box-shadow: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }

    /* Diagram-first workspace polish: calm structural chrome, with the canvas in charge. */

      --chrome-radius: .875rem;
      --space-1: .25rem;
      --space-2: .5rem;
      --space-3: .75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --surface-solid: #ffffff;
      --canvas-background: #f5f7fa;
      --accent: var(--blue);
      --shadow: 0 12px 28px rgba(31, 47, 61, .10);
    }

    body { min-width: 320px; font: 100%/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--canvas-background); }
    button, [role="button"] { font: inherit; }
    button:not(:disabled), [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, [role="button"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    button:not(:disabled):active, .canvas-tool:active, .toolbar-action:active, .panel-toggle:active { transform: scale(.97); transition-duration: 80ms; }

    .workspace-shell {
      grid-template-columns: var(--left-column, var(--sidebar-left)) minmax(0, 1fr) var(--right-column, 0rem);
      background: var(--canvas-background);
      transition: grid-template-columns 220ms cubic-bezier(.2, .8, .2, 1);
    }
    .workspace-shell[data-left-open="false"] { --left-column: 0rem; }
    .workspace-shell[data-right-open="true"] { --right-column: var(--sidebar-right); }
    .canvas-region {
      background-color: var(--canvas-background);
      background-image: radial-gradient(circle, #d4dce5 1px, transparent 1.15px);

          {"id": "watch-phone-out", "from": "watch-connectivity", "to": "iphone-app-external", "description": "세션 상태와 결과를 돌려줍니다", "technology": "WCSession", "status": "active", "sourceAnchor":{"x":505,"y":220},"targetAnchor":{"x":1120,"y":160},"waypoints":[{"x":1376.88,"y":632},{"x":1575.12,"y":632}],"labelPosition":{"x":1476,"y":632}}
        ]
      }
    }
  }
